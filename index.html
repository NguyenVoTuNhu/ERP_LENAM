<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lê Nam ERP — Quản lý sản xuất và kinh doanh đậu hủ</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="Hệ thống quản lý sản xuất, kho, bán hàng và phân phối đậu hủ của Công ty TNHH SX TM DV Lê Nam.">

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- VYKO ERP Design System CSS -->
  <link rel="stylesheet" href="css/style.css?v=20260918-poshub1">
</head>
<body>
  <div class="app">

    <!-- ==================== SIDEBAR ==================== -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo"><i class="fa-solid fa-gear"></i></div>
        <div>
          <div class="brand-name">LÊ NAM ERP</div>
          <div class="brand-sub">MANUFACTURING &amp; FOOD ERP</div>
        </div>
        <button class="sidebar-close" id="sidebarClose" aria-label="Đóng menu"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <nav class="nav" id="nav"></nav>

      <div class="side-foot">
        <button class="side-user" id="sideUser">
          <span class="avatar">HT</span>
          <span>
            <span class="side-user-name">Hà Minh Tú</span>
            <span class="side-user-role">Quản trị viên</span>
          </span>
          <i class="fa-solid fa-ellipsis-vertical"></i>
        </button>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <!-- ==================== MAIN AREA ==================== -->
    <div class="main">
      <!-- TOPBAR -->
      <header class="topbar">
        <button class="icon-btn hamburger" id="hamburger" aria-label="Mở menu"><i class="fa-solid fa-bars"></i></button>

        <div style="min-width:0">
          <div class="crumb-title" id="crumbTitle">Tổng quan doanh nghiệp</div>
          <div class="crumb" id="crumb"></div>
        </div>

        <div class="gsearch" id="gsearchBox">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="globalSearch" placeholder="Tìm khách hàng, đơn hàng, báo giá, LSX…" autocomplete="off">
          <kbd>Ctrl K</kbd>
        </div>

        <button class="btn btn-primary" id="btnCreate"><i class="fa-solid fa-plus"></i><span class="hide-sm">Tạo mới</span></button>
        <button class="icon-btn" id="btnSearchMobile" style="display:none" aria-label="Tìm kiếm"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="icon-btn" id="btnTheme" aria-label="Chế độ tối"><i class="fa-solid fa-moon"></i></button>
        <button class="icon-btn" id="btnBell" aria-label="Thông báo"><i class="fa-regular fa-bell"></i><span class="dot-badge" id="bellCount">0</span></button>
        <button class="icon-btn" id="btnHelp" aria-label="Trợ giúp"><i class="fa-regular fa-circle-question"></i></button>

        <button class="top-user" id="topUser">
          <span class="avatar sm">HT</span>
          <span class="top-user-meta">
            <span class="top-user-name">Hà Minh Tú</span><br>
            <span class="top-user-role">Quản trị viên</span>
          </span>
          <i class="fa-solid fa-chevron-down"></i>
        </button>
      </header>

      <!-- VIEW CONTAINER (Dynamic Module Rendered Here) -->
      <main class="view" id="view"></main>
    </div>
  </div>

  <!-- OVERLAY, MODAL, DRAWER, POPUP DROPDOWN, TOASTS -->
  <div class="overlay" id="overlay"></div>
  <div class="modal-host" id="modalHost"></div>
  <div class="drawer" id="drawer"></div>
  <div class="pop" id="pop"></div>
  <div class="toasts" id="toasts"></div>

  <!-- Chart.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- API server dùng chung do công ty cung cấp -->
  <script src="https://kio.dvqt.vn/list.js"></script>
  <script src="https://kio.dvqt.vn/krud.js"></script>

  <!-- ================================================================
       APP LOAD ORDER
       1) data: dữ liệu demo + config tĩnh

       4) modules: giao diện + business logic từng phân hệ
       5) app.js: actions + bootstrap cuối cùng
       ================================================================ -->

  <script src="js/modules/legacy/quote-engine.js?v=20260916-fgmaster1"></script>

</body>
